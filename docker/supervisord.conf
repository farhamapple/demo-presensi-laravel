[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:queue]
command=sh -c "while [ ! -f /app/vendor/autoload.php ]; do echo '[Queue] Menunggu vendor/autoload.php (jalankan composer install)...'; sleep 5; done; exec php /app/artisan queue:listen --tries=1"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:vite]
command=sh -c "while [ ! -d /app/node_modules ]; do echo '[Vite] Menunggu node_modules (jalankan npm install)...'; sleep 5; done; exec npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5175}"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

